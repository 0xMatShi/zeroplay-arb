# /etc/nginx/sites-available/docs.subline.space
#
# 1. Скопировать на сервер:
#    sudo cp nginx-docs.conf /etc/nginx/sites-available/docs.subline.space
#    sudo ln -s /etc/nginx/sites-available/docs.subline.space /etc/nginx/sites-enabled/
#
# 2. Проверить и применить:
#    sudo nginx -t && sudo systemctl reload nginx
#
# 3. Получить SSL (certbot сам допишет HTTPS блок):
#    sudo certbot --nginx -d docs.subline.space

server {
    listen 80;
    server_name docs.subline.space;

    root /var/www/docs.subline.space;
    index index.html;

    location = /auth-check {
        internal;
        proxy_pass http://127.0.0.1:3000/auth/siwe/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization "";
        proxy_set_header X-Session-Token "";
    }

    location @login_redirect {
        return 302 https://subline.space/?redirect=docs;
    }

    location / {
        auth_request /auth-check;
        error_page 401 403 = @login_redirect;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        auth_request /auth-check;
        error_page 401 403 = @login_redirect;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
