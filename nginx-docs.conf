# /etc/nginx/sites-available/docs.subline.space
#
# Статическая документация Docusaurus с проверкой авторизации через /auth/check.
# Требует: ngx_http_auth_request_module (входит в nginx по умолчанию).
#
# Предполагается, что backend (NestJS) доступен на localhost:3000.
# Если backend на другом адресе — поменяй proxy_pass в /auth-check.

server {
    listen 80;
    server_name docs.subline.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name docs.subline.space;

    ssl_certificate     /etc/letsencrypt/live/docs.subline.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.subline.space/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/docs.subline.space;
    index index.html;

    # ──────────────────────────────────────────────────────────────
    # Внутренний суб-запрос к бэкенду для проверки авторизации.
    # Nginx передаёт Cookie из оригинального запроса пользователя.
    # Бэкенд читает auth_api_key + auth_session_token из кук,
    # возвращает 200 OK (пропустить) или 401 (редирект на логин).
    # ──────────────────────────────────────────────────────────────
    location = /auth-check {
        internal;

        proxy_pass http://127.0.0.1:3000/auth/siwe/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;

        # Не пересылать лишние заголовки ответа
        proxy_set_header Authorization "";
        proxy_set_header X-Session-Token "";
    }

    # ──────────────────────────────────────────────────────────────
    # Куда редиректить незалогиненного пользователя.
    # redirect=docs — подсказка фронтенду, чтобы после логина
    # вернуть пользователя обратно на доки.
    # ──────────────────────────────────────────────────────────────
    location @login_redirect {
        return 302 https://subline.space/?redirect=docs;
    }

    # ──────────────────────────────────────────────────────────────
    # Основная раздача статики.
    # auth_request вызывается ПЕРЕД каждым запросом к файлам.
    # ──────────────────────────────────────────────────────────────
    location / {
        auth_request /auth-check;
        error_page 401 403 = @login_redirect;

        # SPA-роутинг Docusaurus
        try_files $uri $uri/ /index.html;
    }

    # Кэш для статических ассетов (JS/CSS/шрифты)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        auth_request /auth-check;
        error_page 401 403 = @login_redirect;

        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
